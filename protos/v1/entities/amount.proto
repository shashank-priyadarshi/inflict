syntax = "proto3";

package inflict.v1.entities;

option go_package = "go.ssnk.in/inflict/schema/protos/v1/entities;entities";

// Ideate Fixed, Variable, Recurring & OneTime amounts
message Amount {
  string id = 1;
  enum Type {
    TYPE_UNSPECIFIED = 0;
    TYPE_CREDIT = 1;
    TYPE_DEBIT = 2;
  }
  Type type = 2;
  string name = 3;
  string sender = 4;
  string receiver = 5;
  int64 value = 6;
  string currency = 7;
  bool deleted = 8;
}
