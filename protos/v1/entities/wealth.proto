syntax = "proto3";

package inflict.v1.entities;

import "google/protobuf/duration.proto";
import "protos/v1/entities/amount.proto";
import "protos/v1/entities/maintainance.proto";
import "protos/v1/entities/rate.proto";

option go_package = "go.ssnk.in/inflict/schema/protos/v1/entities;entities";

message Worth {
  string id = 1;
  bool deleted = 2;
  repeated Wealth earnings = 3;
  repeated Wealth expenses = 4;
  repeated Wealth liabilities = 5;
  repeated Wealth savings = 6;
  repeated Wealth investments = 7;
  repeated Wealth insurances = 8;
}

message Wealth {
  string id = 1;
  // Redundant because Worth is the primary table for any Entity, Member or Family, Used for development purposes
  enum Type {
    TYPE_UNSPECIFIED = 0;
    TYPE_EARNING = 1;
    TYPE_EXPENSE = 2;
    TYPE_LIABILITY = 3;
    TYPE_SAVING = 4;
    TYPE_INVESTMENT = 5;
    TYPE_INSURANCE = 6;
  }
  Type type = 2;
  string name = 3;
  bool deleted = 4;
  Amount value = 5;
  repeated Return returns = 6;
  repeated Maintainance maintainance = 7;
}

message Return {
  string id = 1;
  string name = 2;
  Rate rate = 3;
  google.protobuf.Duration duration = 4;
  Amount maturity_corpus = 5;
  bool deleted = 6;
}
